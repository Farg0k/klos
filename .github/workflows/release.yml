name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The release workflow needs a permanent key: a debug key generated on
      # a runner changes between runs, so APKs could not update each other.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/klos-release.jks
          printf 'storeFile=klos-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Maven Central occasionally answers 429 to CI runners. Gradle retries
      # once; a second attempt a minute later usually gets through.
      - name: Build APKs
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --split-per-abi && \
            flutter build apk --release && exit 0
            echo "Build attempt $attempt failed, retrying in 60s"
            sleep 60
          done
          echo "::error::The APK build failed after 3 attempts."
          exit 1

      # The release body comes from CHANGELOG.md, because the app shows it as
      # «What's new». GitHub's generated notes are a single compare link, which
      # tells the user nothing.
      - name: Read the changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Prints the body of "## $version", without the heading and without
          # the blank lines around it. CRLF is stripped so a checkout on Windows
          # produces the same notes as on the runner.
          awk -v version="$version" '
            { sub(/\r$/, "") }
            $0 == "## " version { found = 1; next }
            /^## / { if (found) exit }
            found { count++; lines[count] = $0 }
            END {
              while (count > 0 && lines[count] ~ /^[[:space:]]*$/) count--
              first = 1
              while (first <= count && lines[first] ~ /^[[:space:]]*$/) first++
              for (i = first; i <= count; i++) print lines[i]
            }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: build/app/outputs/flutter-apk/*.apk
          fail_on_unmatched_files: true
