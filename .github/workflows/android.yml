name: Android APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to the version in .metadata, so CI builds with the same
      # toolchain as the developer machine.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The release build is signed with the debug key, so no secrets are
      # needed. Split APKs are smaller than the universal one.
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: klos-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
